<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grimorium Dual — Divination &amp; Invocation</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div id="starfield"></div>
<div id="app">

  <div id="view-shelf">
    <div class="shelf-title">Grimorium Dual</div>
    <div class="shelf-sub">l'union de l'ombre et de la lumière pour l'harmonie planétaire</div>

    <div class="yy-stage">
      <div class="yinyang-wrap" id="yy-wrap" onmouseenter="pauseYY(true)" onmouseleave="pauseYY(false)">
        <svg viewBox="0 0 200 200" width="100%" height="100%">
          <circle class="yy-lobe" id="yy-white" cx="100" cy="100" r="98" fill="#ece0c3" stroke="#b8863b" stroke-width="2"
            onclick="openBook('invocation.html')"
            onmouseenter="hoverYY('bestiaire',true)" onmouseleave="hoverYY('bestiaire',false)"/>
          <path class="yy-lobe" id="yy-black"
            d="M100,2 A49,49 0 0,1 100,100 A49,49 0 0,0 100,198 A98,98 0 0,1 100,2 Z"
            fill="#1b1712"
            onclick="openBook('divination.html')"
            onmouseenter="hoverYY('divination',true)" onmouseleave="hoverYY('divination',false)"/>
          <circle class="yy-dot" id="yy-dot-white" cx="100" cy="51" r="15" fill="#ece0c3"
            onclick="openBook('invocation.html')"
            onmouseenter="hoverYY('bestiaire',true)" onmouseleave="hoverYY('bestiaire',false)"/>
          <circle class="yy-dot" id="yy-dot-black" cx="100" cy="149" r="15" fill="#1b1712"
            onclick="openBook('divination.html')"
            onmouseenter="hoverYY('divination',true)" onmouseleave="hoverYY('divination',false)"/>
        </svg>
      </div>

      <div class="yy-captions">
        <div class="yy-caption" id="cap-divination" onclick="openBook('divination.html')">
          Yin · Divination<span class="sub">tarot, runes &amp; tirages</span>
        </div>
        <div class="yy-caption" id="cap-bestiaire" onclick="openBook('invocation.html')">
          Yang · Invocation<span class="sub">bestiaire &amp; échanges</span>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
function pauseYY(on){
  document.getElementById('yy-wrap').classList.toggle('paused', on);
}
function hoverYY(book, on){
  const ids = book==='divination' ? ['yy-black','yy-dot-black'] : ['yy-dot-white','yy-white'];
  ids.forEach(id=>{ const el=document.getElementById(id); if(el) el.classList.toggle('hovered', on); });
  document.getElementById(book==='divination' ? 'cap-divination' : 'cap-bestiaire').classList.toggle('active', on);
}
function openBook(url){
  window.open(url, '_blank');
}

function initStarfield(){
  const container = document.getElementById('starfield');
  const colors = ['#ffffff','#ffffff','#fdf3d0','#fdf3d0','#cfe0ff'];
  const count = 160;
  let html = '';
  for(let i=0;i<count;i++){
    const size = (Math.random()*2 + 0.6).toFixed(2);
    const isBig = Math.random() < 0.08;
    const finalSize = isBig ? (size*1.9).toFixed(2) : size;
    const color = colors[Math.floor(Math.random()*colors.length)];
    const top = (Math.random()*100).toFixed(2);
    const left = (Math.random()*100).toFixed(2);
    const duration = (Math.random()*3 + 2).toFixed(2);
    const delay = (Math.random()*5).toFixed(2);
    const minOp = (Math.random()*0.3 + 0.15).toFixed(2);
    const glow = isBig ? `0 0 ${finalSize*3}px ${color}` : `0 0 ${finalSize*1.5}px ${color}`;
    html += `<div class="star" style="top:${top}%; left:${left}%; width:${finalSize}px; height:${finalSize}px; background:${color}; box-shadow:${glow}; animation-duration:${duration}s; animation-delay:${delay}s; --min-op:${minOp};"></div>`;
  }
  container.innerHTML = html;
}
initStarfield();
</script>
</body>
</html>
