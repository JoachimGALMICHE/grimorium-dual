<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grimorium Dual — Divination &amp; Invocation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap');

:root{
  --ink:#1b1712;
  --ink-soft:#2a2118;
  --night:#0a0d1f;
  --night-deep:#050713;
  --parchment:#ece0c3;
  --parchment-dark:#ddc99a;
  --parchment-shadow: rgba(27,23,18,0.35);
  --gold:#b8863b;
  --gold-bright:#d9a94f;
  --divi:#3b4d7a;
  --divi-bright:#5b73ac;
  --best:#6e2430;
  --best-bright:#9c3a48;
  --line: rgba(27,23,18,0.18);
}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
html,body{margin:0;padding:0; overflow-x:hidden; max-width:100%;}
body{
  background:
    radial-gradient(ellipse at 15% 8%, rgba(120,140,220,0.16), transparent 42%),
    radial-gradient(ellipse at 85% 15%, rgba(184,134,59,0.09), transparent 40%),
    radial-gradient(ellipse at 75% 85%, rgba(90,70,150,0.20), transparent 50%),
    radial-gradient(ellipse at 25% 90%, rgba(59,77,122,0.18), transparent 45%),
    linear-gradient(180deg, var(--night-deep), var(--night) 40%, #0d1230 100%);
  color:var(--parchment);
  font-family:'EB Garamond', serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

#starfield{
  position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
}
.star{
  position:absolute; border-radius:50%;
  animation:twinkle ease-in-out infinite;
}
@keyframes twinkle{
  0%,100%{ opacity:var(--min-op,0.25); transform:scale(0.85); }
  50%{ opacity:1; transform:scale(1.15); }
}
#app{ position:relative; z-index:1; }

h1,h2,h3,.display{
  font-family:'Cinzel', serif;
  letter-spacing:0.02em;
  margin:0;
}

.eyebrow{
  font-family:'Space Mono', monospace;
  font-size:0.7rem;
  letter-spacing:0.22em;
  text-transform:uppercase;
  opacity:0.75;
}

/* ---------- LAYOUT WRAPPER ---------- */
#app{max-width:1100px;margin:0 auto;padding:32px 20px 90px; width:100%;}
@media (max-width:680px){ #app{ padding:20px 14px 70px; } }

/* ---------- SHELF (HOME) ---------- */
.shelf-title{
  text-align:center;
  font-family:'Cinzel Decorative', serif;
  font-size:clamp(2rem,5vw,3.2rem);
  color:var(--gold-bright);
  text-shadow:0 2px 14px rgba(0,0,0,0.5);
  margin-bottom:6px;
}
.shelf-sub{
  text-align:center;
  font-family:'EB Garamond',serif;
  font-style:italic;
  opacity:0.7;
  margin-bottom:10px;
  font-size:1.05rem;
}

#view-shelf{ position:relative; }

/* --- Yin-Yang home --- */
.yy-stage{
  display:flex; flex-direction:column; align-items:center; gap:22px;
  margin-top:26px; margin-bottom:20px;
}
.yinyang-wrap{
  width:min(56vw,320px); aspect-ratio:1/1;
  animation:yy-spin 46s linear infinite;
  filter:drop-shadow(0 20px 45px rgba(0,0,0,0.55));
}
.yinyang-wrap.paused{ animation-play-state:paused; }
@keyframes yy-spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

.yy-lobe{ cursor:pointer; transition:filter .2s; }
.yy-lobe.hovered{ filter:brightness(1.35); }
.yy-dot{ cursor:pointer; transition:filter .2s; }
.yy-dot.hovered{ filter:brightness(1.5); }

.yy-captions{ display:flex; gap:36px; flex-wrap:wrap; justify-content:center; }
.yy-caption{
  font-family:'Cinzel', serif; font-size:0.95rem; letter-spacing:0.08em; text-transform:uppercase;
  opacity:0.5; transition:opacity .2s, color .2s; cursor:pointer; text-align:center;
}
.yy-caption .sub{ display:block; font-family:'EB Garamond',serif; font-style:italic; text-transform:none; letter-spacing:0; font-size:0.85rem; margin-top:2px; }
.yy-caption.active{ opacity:1; color:var(--gold-bright); }

/* ---------- BOOK VIEW ---------- */
.book-view{ display:none; }
.book-view.active{ display:block; animation:pageIn .35s ease; }
@keyframes pageIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.book-header{
  display:flex; align-items:center; justify-content:flex-start;
  margin-bottom:22px; flex-wrap:wrap; gap:12px;
}
.back-btn{
  font-family:'Space Mono',monospace; font-size:0.75rem; letter-spacing:0.1em;
  text-transform:uppercase; color:var(--gold-bright); background:none; border:1px solid var(--gold);
  padding:10px 14px; border-radius:20px; cursor:pointer; min-height:44px; flex-shrink:0;
}
.back-btn:hover{ background:rgba(184,134,59,0.15); }

.book-title{ font-family:'Cinzel Decorative',serif; font-size:1.7rem; color:var(--parchment); flex:1; text-align:center; min-width:180px; }

/* bookmark tabs */
.tabs{ display:flex; gap:4px; margin-bottom:0; overflow-x:auto; -webkit-overflow-scrolling:touch; }
.tab{
  font-family:'Cinzel',serif; font-size:0.85rem; letter-spacing:0.04em;
  padding:12px 18px 14px; border:none; cursor:pointer; color:var(--parchment);
  background:rgba(255,255,255,0.06); border-radius:10px 10px 0 0;
  opacity:0.6; transition:opacity .2s, background .2s; position:relative; top:1px;
  white-space:nowrap; flex-shrink:0; min-height:44px;
}
.tab.active{ opacity:1; background:var(--parchment); color:var(--ink); font-weight:600; }
.tab:hover:not(.active){ opacity:0.9; }

.page{
  background:var(--parchment);
  color:var(--ink-soft);
  border-radius:0 12px 12px 12px;
  padding:30px 28px;
  box-shadow:0 20px 50px rgba(0,0,0,0.5);
  background-image:
    radial-gradient(circle at 90% 10%, rgba(184,134,59,0.06), transparent 40%),
    radial-gradient(circle at 5% 95%, rgba(110,36,48,0.05), transparent 35%);
  min-height:400px;
}
.tab-panel{ display:none; }
.tab-panel.active{ display:block; }

/* ---------- SEARCH & FILTERS ---------- */
.controls{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; align-items:center; }
.search-input{
  flex:1; min-width:180px;
  font-family:'EB Garamond',serif; font-size:1rem;
  padding:10px 14px; border-radius:8px; border:1px solid var(--line);
  background:rgba(255,255,255,0.5); color:var(--ink);
}
.filter-btn{
  font-family:'Space Mono',monospace; font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase;
  padding:10px 14px; border-radius:16px; border:1px solid var(--line); background:transparent;
  color:var(--ink-soft); cursor:pointer; opacity:0.7; min-height:40px;
}
.filter-btn.active{ opacity:1; background:var(--ink); color:var(--parchment); border-color:var(--ink); }

/* ---------- CARDS (accordion) ---------- */
.card-list{ display:flex; flex-direction:column; gap:10px; }
.card{
  border:1px solid var(--line); border-radius:10px; overflow:hidden;
  background:rgba(255,255,255,0.35);
}
.card-header{
  display:flex; align-items:center; gap:12px; padding:13px 16px; cursor:pointer; user-select:none;
}
.card-header .symbol{ font-size:1.4rem; width:34px; text-align:center; flex-shrink:0; }
.card-header .titles{ flex:1; min-width:0; }
.card-header .name{ font-family:'Cinzel',serif; font-size:1.02rem; font-weight:600; }
.card-header .meta{ font-family:'Space Mono',monospace; font-size:0.68rem; letter-spacing:0.06em; text-transform:uppercase; opacity:0.55; }
.card-header .chevron{ font-size:0.85rem; opacity:0.5; transition:transform .2s; flex-shrink:0; }
.card.open .chevron{ transform:rotate(180deg); }
.card-body{ display:none; padding:0 16px 18px 62px; }
.card.open .card-body{ display:block; animation:pageIn .2s ease; }

.meaning-block{ margin-bottom:10px; }
.meaning-label{ font-family:'Space Mono',monospace; font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:3px; }
.meaning-label.up{ color:var(--divi); } 
.meaning-label.rev{ color:var(--best); }
.meaning-text{ font-size:1rem; line-height:1.5; }

/* ---------- BUTTONS ---------- */
.btn{
  font-family:'Cinzel',serif; font-size:0.82rem; letter-spacing:0.03em;
  padding:11px 18px; border-radius:8px; border:1px solid var(--ink); background:var(--ink); color:var(--parchment);
  cursor:pointer; transition:transform .15s, opacity .15s; min-height:44px;
}
.btn:hover{ transform:translateY(-1px); opacity:0.9; }
.btn.ghost{ background:transparent; color:var(--ink); }
.btn.gold{ background:var(--gold); border-color:var(--gold); color:#1b1712; }
.btn.danger{ background:transparent; border-color:var(--best); color:var(--best); }
.btn.small{ padding:8px 12px; font-size:0.72rem; min-height:38px; }

.add-bar{ margin-bottom:18px; }

/* ---------- FORMS ---------- */
.form-panel{
  border:1px dashed var(--gold); border-radius:10px; padding:20px; margin-bottom:22px;
  background:rgba(184,134,59,0.06); display:none;
}
.form-panel.open{ display:block; }
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
.form-grid.full, .form-field.full{ grid-column:1 / -1; }
.form-field label{ font-family:'Space Mono',monospace; font-size:0.68rem; letter-spacing:0.08em; text-transform:uppercase; display:block; margin-bottom:5px; opacity:0.7; }
.form-field input, .form-field select, .form-field textarea{
  width:100%; font-family:'EB Garamond',serif; font-size:1rem; padding:11px;
  border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink);
}
.form-field textarea{ resize:vertical; min-height:70px; }
.form-actions{ display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }

/* ---------- EXCHANGE TABLE ---------- */
.exchange-table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin-top:6px; }
.exchange-table{ width:100%; min-width:380px; border-collapse:collapse; }
.exchange-table th{ font-family:'Space Mono',monospace; font-size:0.65rem; text-transform:uppercase; letter-spacing:0.06em; text-align:left; padding:6px 8px; opacity:0.6; border-bottom:1px solid var(--line); }
.exchange-table td{ padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
.exchange-table .lvl{ font-family:'Cinzel',serif; font-weight:700; width:30px; text-align:center; }
.exchange-table input{ width:100%; font-family:'EB Garamond',serif; padding:8px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); font-size:0.95rem; }
.exchange-static{ display:grid; grid-template-columns:24px 1fr 1fr; gap:6px 10px; font-size:0.9rem; }
.exchange-static .h{ font-family:'Space Mono',monospace; font-size:0.65rem; text-transform:uppercase; opacity:0.55; }

/* creature card thumb */
.creature-img{ width:34px; height:34px; border-radius:6px; object-fit:cover; flex-shrink:0; background:var(--parchment-dark); display:flex; align-items:center; justify-content:center; font-size:1.2rem; }

.detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 24px; margin-bottom:14px; }
.detail-item .label{ font-family:'Space Mono',monospace; font-size:0.66rem; text-transform:uppercase; letter-spacing:0.06em; opacity:0.55; margin-bottom:2px; }
.detail-item .value{ font-size:0.98rem; line-height:1.4; }
.card-actions{ display:flex; gap:8px; margin-top:14px; }

.empty-note{ font-style:italic; opacity:0.6; padding:20px 4px; text-align:center; }

.journal-entry-header .meta{ opacity:0.6; }
.type-tag{
  font-family:'Space Mono',monospace; font-size:0.62rem; text-transform:uppercase; letter-spacing:0.06em;
  padding:2px 8px; border-radius:10px; background:var(--divi); color:#fff; margin-left:6px;
}
.type-tag.oracle{ background:var(--best); }
.type-tag.vision{ background:#5a4a7a; }
.type-tag.runes{ background:#5b6b3a; }

@media (max-width:680px){
  .form-grid{ grid-template-columns:1fr; }
  .detail-grid{ grid-template-columns:1fr; }
  .card-body{ padding-left:16px; }
  .book-title{ font-size:1.35rem; min-width:140px; }
  .yy-caption{ font-size:0.8rem; }
}

input[type="file"]{
  font-family:'EB Garamond',serif; font-size:0.9rem; color:var(--ink-soft);
  max-width:100%;
}

.save-status{ font-family:'Space Mono',monospace; font-size:0.65rem; opacity:0.5; text-align:right; margin-top:6px; }

.sync-badge{
  position:fixed; bottom:14px; left:14px; z-index:5;
  font-family:'Space Mono',monospace; font-size:0.65rem; letter-spacing:0.04em;
  padding:6px 12px; border-radius:14px; background:rgba(0,0,0,0.45); backdrop-filter:blur(4px);
  border:1px solid rgba(255,255,255,0.15); color:var(--parchment); opacity:0.85;
}
.sync-badge.ok{ border-color:rgba(127,191,106,0.5); color:#bfe6b0; }
.sync-badge.warn{ border-color:rgba(217,169,79,0.5); color:var(--gold-bright); }
.sync-badge.err{ border-color:rgba(224,138,138,0.6); color:#f0a8a8; }

.toast{
  position:fixed; bottom:52px; left:50%; transform:translateX(-50%) translateY(20px);
  font-family:'Cinzel',serif; font-size:0.85rem; padding:12px 22px; border-radius:24px;
  background:var(--ink); color:var(--parchment); border:1px solid var(--gold);
  z-index:20; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  max-width:80vw; text-align:center;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.toast.err{ border-color:var(--best); }
</style>
</head>
<body>
<div id="starfield"></div>
<div id="sync-badge" class="sync-badge"></div>
<div id="app">

  <!-- HOME SHELF -->
  <div id="view-shelf">
    <div class="shelf-title">Grimorium Dual</div>
    <div class="shelf-sub">l'union de l'ombre et de la lumière pour l'harmonie planétaire</div>

    <div class="yy-stage">
      <div class="yinyang-wrap" id="yy-wrap" onmouseenter="pauseYY(true)" onmouseleave="pauseYY(false)">
        <svg viewBox="0 0 200 200" width="100%" height="100%">
          <circle class="yy-lobe" id="yy-white" cx="100" cy="100" r="98" fill="#ece0c3" stroke="#b8863b" stroke-width="2"
            onclick="openBook('bestiaire')"
            onmouseenter="hoverYY('bestiaire',true)" onmouseleave="hoverYY('bestiaire',false)"/>
          <path class="yy-lobe" id="yy-black"
            d="M100,2 A49,49 0 0,1 100,100 A49,49 0 0,0 100,198 A98,98 0 0,1 100,2 Z"
            fill="#1b1712"
            onclick="openBook('divination')"
            onmouseenter="hoverYY('divination',true)" onmouseleave="hoverYY('divination',false)"/>
          <circle class="yy-dot" id="yy-dot-white" cx="100" cy="51" r="15" fill="#ece0c3"
            onclick="openBook('bestiaire')"
            onmouseenter="hoverYY('bestiaire',true)" onmouseleave="hoverYY('bestiaire',false)"/>
          <circle class="yy-dot" id="yy-dot-black" cx="100" cy="149" r="15" fill="#1b1712"
            onclick="openBook('divination')"
            onmouseenter="hoverYY('divination',true)" onmouseleave="hoverYY('divination',false)"/>
        </svg>
      </div>

      <div class="yy-captions">
        <div class="yy-caption" id="cap-divination" onclick="openBook('divination')">
          Yin · Divination<span class="sub">tarot, runes &amp; tirages</span>
        </div>
        <div class="yy-caption" id="cap-bestiaire" onclick="openBook('bestiaire')">
          Yang · Invocation<span class="sub">bestiaire &amp; échanges</span>
        </div>
      </div>
    </div>
  </div>

  <!-- DIVINATION BOOK -->
  <div id="view-divination" class="book-view">
    <div class="book-header">
      <button class="back-btn" onclick="closeBook()">← Retour à l'étagère</button>
      <div class="book-title">🔮 Livre de Divination</div>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="tarot" onclick="switchTab('tarot')">Tarot</button>
      <button class="tab" data-tab="runes" onclick="switchTab('runes')">Runes</button>
      <button class="tab" data-tab="journal" onclick="switchTab('journal')">Journal des tirages</button>
    </div>
    <div class="page">

      <div class="tab-panel active" id="panel-tarot">
        <div class="controls">
          <input class="search-input" id="tarot-search" placeholder="Rechercher une carte…" oninput="renderTarot()">
        </div>
        <div class="controls" id="tarot-filters"></div>
        <div class="card-list" id="tarot-list"></div>
      </div>

      <div class="tab-panel" id="panel-runes">
        <div class="controls">
          <input class="search-input" id="rune-search" placeholder="Rechercher une rune…" oninput="renderRunes()">
        </div>
        <div class="card-list" id="rune-list"></div>
      </div>

      <div class="tab-panel" id="panel-journal">
        <div class="add-bar">
          <button class="btn gold" onclick="toggleJournalForm()">+ Nouveau tirage</button>
        </div>
        <div class="form-panel" id="journal-form">
          <div class="form-grid">
            <div class="form-field">
              <label>Type de tirage</label>
              <select id="j-type">
                <option value="tarot">Tarot</option>
                <option value="runes">Runes</option>
                <option value="oracle">Oracle</option>
                <option value="vision">Vision</option>
              </select>
            </div>
            <div class="form-field">
              <label>Date</label>
              <input type="date" id="j-date">
            </div>
            <div class="form-field full">
              <label>Tirage (cartes/runes tirées, position, contexte…)</label>
              <input type="text" id="j-tirage" placeholder="Ex : Le Bateleur (droit), Trois de Coupes (inversé)…">
            </div>
            <div class="form-field full">
              <label>Message / interprétation tirée</label>
              <textarea id="j-message" placeholder="Qu'est-ce que ce tirage t'a dit ?"></textarea>
            </div>
            <div class="form-field full">
              <label>Notes complémentaires</label>
              <textarea id="j-notes" placeholder="Ressenti, contexte, suivi…"></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button class="btn ghost" onclick="toggleJournalForm(false)">Annuler</button>
            <button class="btn gold" id="j-save-btn" onclick="saveJournalEntry()">Enregistrer</button>
          </div>
        </div>
        <div class="card-list" id="journal-list"></div>
      </div>

    </div>
  </div>

  <!-- BESTIAIRE BOOK -->
  <div id="view-bestiaire" class="book-view">
    <div class="book-header">
      <button class="back-btn" onclick="closeBook()">← Retour à l'étagère</button>
      <div class="book-title">🐾 Livre d'Invocation</div>
    </div>
    <div class="page" style="border-radius:12px;">
      <div class="controls">
        <input class="search-input" id="beast-search" placeholder="Rechercher une créature…" oninput="renderBestiaire()">
        <button class="btn gold" onclick="toggleBeastForm()">+ Nouvelle fiche</button>
      </div>
      <div class="controls" id="beast-filters"></div>

      <div class="form-panel" id="beast-form">
        <div class="form-grid">
          <div class="form-field"><label>Nom</label><input type="text" id="b-name"></div>
          <div class="form-field"><label>Race</label><input type="text" id="b-race"></div>
          <div class="form-field">
            <label>Catégorie</label>
            <select id="b-category">
              <option value="Divinité">Divinité</option>
              <option value="Ancêtre & esprit familier">Ancêtre &amp; esprit familier</option>
              <option value="Esprit de la nature">Esprit de la nature</option>
              <option value="Être céleste">Être céleste</option>
              <option value="Force élémentaire">Force élémentaire</option>
            </select>
          </div>
          <div class="form-field full">
            <label>Image</label>
            <input type="file" id="b-image-file" accept="image/*" onchange="handleImageUpload(event)">
            <div style="display:flex; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap;">
              <img id="b-image-preview" class="creature-img" style="width:52px;height:52px;display:none;">
              <input type="text" id="b-image" placeholder="ou emoji / URL (optionnel)" style="flex:1; min-width:180px;">
            </div>
          </div>
          <div class="form-field"><label>Domaine de compétence</label><input type="text" id="b-domaine"></div>
          <div class="form-field"><label>Caractère</label><input type="text" id="b-caractere"></div>
          <div class="form-field"><label>Habitat</label><input type="text" id="b-habitat"></div>
          <div class="form-field"><label>Habitude</label><input type="text" id="b-habitude"></div>
          <div class="form-field full"><label>Comment interagir</label><textarea id="b-interaction"></textarea></div>
        </div>
        <div class="form-field full" style="margin-bottom:14px;">
          <label>Échange (niveau 1 à 5)</label>
          <div class="exchange-table-wrap">
          <table class="exchange-table">
            <thead><tr><th></th><th>Ce que j'offre</th><th>Ce que je reçois</th></tr></thead>
            <tbody id="b-exchange-rows"></tbody>
          </table>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn ghost" onclick="toggleBeastForm(false)">Annuler</button>
          <button class="btn gold" id="b-save-btn" onclick="saveBeast()">Enregistrer la fiche</button>
        </div>
      </div>

      <div class="card-list" id="beast-list"></div>
    </div>
  </div>

</div>

<script>
/* ============================================================
   DONNÉES : TAROT
   ============================================================ */

function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ---------- Stockage : Claude par défaut, Firebase optionnel ---------- */
let firebaseDb = null;
let firebaseReady = false;
let lastFirebaseErrorCode = null;

function loadScript(src){
  return new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function initFirebaseFromConfig(config){
  try{
    if(!window.firebase){
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js');
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js');
    }
    if(!firebase.apps.length){ firebase.initializeApp(config); }
    firebaseDb = firebase.firestore();
    // Le streaming WebChannel par défaut est bloqué dans certains bacs à sable :
    // on force le long polling, plus lent mais fiable partout.
    firebaseDb.settings({ experimentalForceLongPolling: true, useFetchStreams: false, merge: true });
    firebaseReady = true;
    return true;
  }catch(e){
    // Repli silencieux sur le stockage Claude si Firebase est indisponible (réseau, CDN bloqué…)
    firebaseReady = false;
    lastFirebaseErrorCode = (e && (e.code || e.message)) || 'init-failed';
    return false;
  }
}

function hasClaudeStorage(){
  return typeof window.storage !== 'undefined' && window.storage !== null;
}

/* Chargement d'une liste entière (Firestore : une collection ; Claude : un tableau JSON dans une clé) */
async function loadList(collectionName, claudeKey){
  if(firebaseReady){
    try{
      const snap = await firebaseDb.collection(collectionName).get({source:'server'});
      const arr = [];
      snap.forEach(doc=>arr.push(doc.data()));
      return arr;
    }catch(e){
      lastFirebaseErrorCode = e && (e.code || e.message);
      firebaseReady = false;
      updateSyncBadge();
    }
  }
  if(hasClaudeStorage()){
    try{
      const r = await window.storage.get(claudeKey, false);
      return r ? JSON.parse(r.value) : [];
    }catch(e){ return []; }
  }
  return [];
}

/* Sauvegarde d'un seul élément : un document Firestore par fiche (évite la limite de ~1 Mo par document) */
const CONNECTIVITY_CODES = ['unavailable','permission-denied','unauthenticated','not-found','failed-precondition','resource-exhausted'];
function recordFirebaseError(e, context){
  const code = e && e.code ? e.code : 'unknown';
  const message = e && e.message ? e.message : String(e);
  lastFirebaseErrorCode = code + (message ? ' — ' + message : '');
  console.error('[Grimorium Dual] Firestore ' + context + ' a échoué :', e);
  // On ne coupe Firestore que pour de vraies pannes de connexion/permission,
  // pas pour une erreur liée aux données d'une seule fiche (invalid-argument…)
  if(CONNECTIVITY_CODES.includes(code)){
    firebaseReady = false;
    updateSyncBadge();
  }
}

async function saveItem(collectionName, claudeKey, list, item){
  if(firebaseReady){
    try{ await firebaseDb.collection(collectionName).doc(item.id).set(item); return 'firebase'; }
    catch(e){ recordFirebaseError(e, 'set'); }
  }
  if(hasClaudeStorage()){
    try{ await window.storage.set(claudeKey, JSON.stringify(list), false); return 'claude'; }
    catch(e){ /* échec aussi côté Claude */ }
  }
  return null;
}
async function deleteItem(collectionName, claudeKey, list, id){
  if(firebaseReady){
    try{ await firebaseDb.collection(collectionName).doc(id).delete(); return 'firebase'; }
    catch(e){ recordFirebaseError(e, 'delete'); }
  }
  if(hasClaudeStorage()){
    try{ await window.storage.set(claudeKey, JSON.stringify(list), false); return 'claude'; }
    catch(e){ /* échec aussi côté Claude */ }
  }
  return null;
}

function saveResultMessage(result, verb){
  if(result==='firebase') return { msg: verb + ' ✓ (synchronisé sur tous tes appareils)', err:false };
  if(result==='claude') return { msg: verb + ' ✓ (sauvegardé sur ce compte Claude, pas de sync Firebase)', err:false };
  const code = lastFirebaseErrorCode ? ` [${lastFirebaseErrorCode}]` : '';
  return { msg: `Échec de la sauvegarde${code} — note ce code et dis-le à Claude`, err:true };
}

/* ---------- Indicateur de synchronisation & messages ---------- */
function updateSyncBadge(){
  const el = document.getElementById('sync-badge');
  if(!el) return;
  if(firebaseReady){
    el.textContent = '☁ Synchronisé (Firebase)';
    el.className = 'sync-badge ok';
  }else if(hasClaudeStorage()){
    el.textContent = '🔒 Sauvegardé sur ce compte Claude uniquement';
    el.className = 'sync-badge warn';
  }else{
    el.textContent = '⚠ Aucune sauvegarde active — les fiches seront perdues';
    el.className = 'sync-badge err';
  }
}
function showToast(msg, isError){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.className = 'toast show' + (isError ? ' err' : '');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ el.className = 'toast'; }, 2600);
}

/* ---------- Upload & compression d'image ---------- */
function handleImageUpload(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxDim = 480;
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
      else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      pendingImageData = canvas.toDataURL('image/jpeg', 0.72);
      const preview = document.getElementById('b-image-preview');
      preview.src = pendingImageData;
      preview.style.display = 'block';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function renderTarotFilters(){
  const filters = [
    {key:'all', label:'Toutes'},
    {key:'major', label:'Arcanes majeurs'},
    {key:'batons', label:'Bâtons'},
    {key:'coupes', label:'Coupes'},
    {key:'epees', label:'Épées'},
    {key:'deniers', label:'Deniers'}
  ];
  document.getElementById('tarot-filters').innerHTML = filters.map(f=>
    `<button class="filter-btn ${tarotFilter===f.key?'active':''}" onclick="setTarotFilter('${f.key}')">${f.label}</button>`
  ).join('');
}
function setTarotFilter(key){ tarotFilter = key; renderTarot(); }

function renderTarot(){
  renderTarotFilters();
  const q = (document.getElementById('tarot-search').value || '').toLowerCase();
  let list = ALL_TAROT.filter(c=>{
    const matchFilter = tarotFilter==='all' || c.suit===tarotFilter;
    const matchQuery = c.name.toLowerCase().includes(q);
    return matchFilter && matchQuery;
  });
  const el = document.getElementById('tarot-list');
  if(list.length===0){ el.innerHTML = '<div class="empty-note">Aucune carte ne correspond à ta recherche.</div>'; return; }
  el.innerHTML = list.map((c,i)=>{
    const id = c.name;
    const open = expandedTarot.has(id);
    return `
    <div class="card ${open?'open':''}">
      <div class="card-header" onclick="toggleTarot('${id.replace(/'/g,"\\'")}')">
        <div class="symbol">${c.symbol}</div>
        <div class="titles">
          <div class="name">${escapeHtml(c.name)}</div>
          <div class="meta">${c.suit==='major' ? 'Arcane majeur ' + c.n : 'Arcane mineur'}</div>
        </div>
        <div class="chevron">▾</div>
      </div>
      <div class="card-body">
        <div class="meaning-block">
          <div class="meaning-label up">À l'endroit</div>
          <div class="meaning-text">${escapeHtml(c.up)}</div>
        </div>
        <div class="meaning-block">
          <div class="meaning-label rev">Inversée</div>
          <div class="meaning-text">${escapeHtml(c.rev)}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}
function toggleTarot(id){
  if(expandedTarot.has(id)) expandedTarot.delete(id); else expandedTarot.add(id);
  renderTarot();
}

   JOURNAL DES TIRAGES
   ============================================================ */
function toggleJournalForm(show){
  const panel = document.getElementById('journal-form');
  const willShow = show!==undefined ? show : !panel.classList.contains('open');
  panel.classList.toggle('open', willShow);
  if(willShow && !editingJournalId){
    document.getElementById('j-type').value = 'tarot';
    document.getElementById('j-date').value = new Date().toISOString().slice(0,10);
    document.getElementById('j-tirage').value = '';
    document.getElementById('j-message').value = '';
    document.getElementById('j-notes').value = '';
  }
  if(!willShow){ editingJournalId = null; document.getElementById('j-save-btn').textContent = 'Enregistrer'; }
}
async function saveJournalEntry(){
  const entry = {
    id: editingJournalId || uid(),
    type: document.getElementById('j-type').value,
    date: document.getElementById('j-date').value || new Date().toISOString().slice(0,10),
    tirage: document.getElementById('j-tirage').value.trim(),
    message: document.getElementById('j-message').value.trim(),
    notes: document.getElementById('j-notes').value.trim()
  };
  if(!entry.tirage && !entry.message){ alert('Ajoute au moins le tirage ou le message reçu.'); return; }
  if(editingJournalId){
    const idx = journalEntries.findIndex(e=>e.id===editingJournalId);
    if(idx>-1) journalEntries[idx] = entry;
  }else{
    journalEntries.unshift(entry);
  }
  const result = await persistJournalItem(entry);
  const r = saveResultMessage(result, 'Tirage enregistré');
  showToast(r.msg, r.err);
  toggleJournalForm(false);
  renderJournal();
}
function editJournalEntry(id){
  const e = journalEntries.find(x=>x.id===id);
  if(!e) return;
  editingJournalId = id;
  document.getElementById('j-type').value = e.type;
  document.getElementById('j-date').value = e.date;
  document.getElementById('j-tirage').value = e.tirage;
  document.getElementById('j-message').value = e.message;
  document.getElementById('j-notes').value = e.notes;
  document.getElementById('j-save-btn').textContent = 'Mettre à jour';
  toggleJournalForm(true);
  window.scrollTo({top:0, behavior:'smooth'});
}
async function deleteJournalEntry(id){
  if(!confirm('Supprimer ce tirage du journal ?')) return;
  journalEntries = journalEntries.filter(e=>e.id!==id);
  const result = await removeJournalItem(id);
  const r = saveResultMessage(result, 'Tirage supprimé');
  showToast(r.msg, r.err);
  renderJournal();
}
function toggleJournalCard(id){
  if(expandedJournal.has(id)) expandedJournal.delete(id); else expandedJournal.add(id);
  renderJournal();
}
function renderJournal(){
  const el = document.getElementById('journal-list');
  if(journalEntries.length===0){ el.innerHTML = '<div class="empty-note">Aucun tirage enregistré pour l\'instant.</div>'; return; }
  el.innerHTML = journalEntries.map(e=>{
    const open = expandedJournal.has(e.id);
    return `
    <div class="card ${open?'open':''}">
      <div class="card-header journal-entry-header" onclick="toggleJournalCard('${e.id}')">
        <div class="symbol">${e.type==='tarot'?'🎴':e.type==='runes'?'ᚱ':e.type==='oracle'?'🃏':'👁️'}</div>
        <div class="titles">
          <div class="name">${escapeHtml(e.date)} <span class="type-tag ${e.type}">${e.type}</span></div>
          <div class="meta">${escapeHtml((e.tirage||e.message||'').slice(0,60))}${(e.tirage||e.message||'').length>60?'…':''}</div>
        </div>
        <div class="chevron">▾</div>
      </div>
      <div class="card-body">
        ${e.tirage?`<div class="meaning-block"><div class="meaning-label up">Tirage</div><div class="meaning-text">${escapeHtml(e.tirage)}</div></div>`:''}
        ${e.message?`<div class="meaning-block"><div class="meaning-label up">Message reçu</div><div class="meaning-text">${escapeHtml(e.message)}</div></div>`:''}
        ${e.notes?`<div class="meaning-block"><div class="meaning-label rev">Notes</div><div class="meaning-text">${escapeHtml(e.notes)}</div></div>`:''}
        <div class="card-actions">
          <button class="btn small ghost" onclick="editJournalEntry('${e.id}')">Modifier</button>
          <button class="btn small danger" onclick="deleteJournalEntry('${e.id}')">Supprimer</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ============================================================
   BESTIAIRE
   ============================================================ */
function renderExchangeRows(data){
  const rows = data && data.length===5 ? data : [1,2,3,4,5].map(()=>({offre:'',recois:''}));
  document.getElementById('b-exchange-rows').innerHTML = rows.map((r,i)=>`
    <tr>
      <td class="lvl">${i+1}</td>
      <td><input type="text" class="ex-offre" data-i="${i}" value="${escapeHtml(r.offre)}" placeholder="Ex : confiance, offrande…"></td>
      <td><input type="text" class="ex-recois" data-i="${i}" value="${escapeHtml(r.recois)}" placeholder="Ex : protection, savoir…"></td>
    </tr>
  `).join('');
}
function renderBeastFilters(){
  const filters = [{key:'all', label:'Toutes'}, ...CATEGORIES.map(c=>({key:c, label:c}))];
  document.getElementById('beast-filters').innerHTML = filters.map(f=>
    `<button class="filter-btn ${beastCategoryFilter===f.key?'active':''}" onclick="setBeastFilter('${f.key.replace(/'/g,"\\'")}')">${escapeHtml(f.label)}</button>`
  ).join('');
}
function setBeastFilter(key){ beastCategoryFilter = key; renderBestiaire(); }

function toggleBeastForm(show){
  const panel = document.getElementById('beast-form');
  const willShow = show!==undefined ? show : !panel.classList.contains('open');
  panel.classList.toggle('open', willShow);
  if(willShow && !editingBeastId){
    ['b-name','b-race','b-image','b-domaine','b-caractere','b-habitat','b-habitude','b-interaction'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('b-category').value = CATEGORIES[0];
    document.getElementById('b-image-file').value = '';
    document.getElementById('b-image-preview').style.display = 'none';
    pendingImageData = null;
    renderExchangeRows();
  }
  if(!willShow){ editingBeastId = null; pendingImageData = null; document.getElementById('b-save-btn').textContent = 'Enregistrer la fiche'; }
}
async function saveBeast(){
  const name = document.getElementById('b-name').value.trim();
  if(!name){ alert('Donne au moins un nom à la créature.'); return; }
  const offres = Array.from(document.querySelectorAll('.ex-offre')).map(i=>i.value.trim());
  const recois = Array.from(document.querySelectorAll('.ex-recois')).map(i=>i.value.trim());
  const echanges = [0,1,2,3,4].map(i=>({offre:offres[i]||'', recois:recois[i]||''}));
  const existing = editingBeastId ? beasts.find(b=>b.id===editingBeastId) : null;
  const image = pendingImageData || document.getElementById('b-image').value.trim() || (existing ? existing.image : '');
  const beast = {
    id: editingBeastId || uid(),
    name,
    race: document.getElementById('b-race').value.trim(),
    category: document.getElementById('b-category').value,
    image,
    domaine: document.getElementById('b-domaine').value.trim(),
    caractere: document.getElementById('b-caractere').value.trim(),
    habitat: document.getElementById('b-habitat').value.trim(),
    habitude: document.getElementById('b-habitude').value.trim(),
    interaction: document.getElementById('b-interaction').value.trim(),
    echanges
  };
  if(editingBeastId){
    const idx = beasts.findIndex(b=>b.id===editingBeastId);
    if(idx>-1) beasts[idx] = beast;
  }else{
    beasts.unshift(beast);
  }
  const result = await persistBeastItem(beast);
  const r = saveResultMessage(result, 'Fiche enregistrée');
  showToast(r.msg, r.err);
  toggleBeastForm(false);
  renderBestiaire();
}
function editBeast(id){
  const b = beasts.find(x=>x.id===id);
  if(!b) return;
  editingBeastId = id;
  pendingImageData = null;
  document.getElementById('b-name').value = b.name;
  document.getElementById('b-race').value = b.race;
  document.getElementById('b-category').value = b.category || CATEGORIES[0];
  document.getElementById('b-image-file').value = '';
  const preview = document.getElementById('b-image-preview');
  if(b.image && /^(data:|https?:)/.test(b.image)){ preview.src = b.image; preview.style.display = 'block'; document.getElementById('b-image').value=''; }
  else{ preview.style.display = 'none'; document.getElementById('b-image').value = b.image || ''; }
  document.getElementById('b-domaine').value = b.domaine;
  document.getElementById('b-caractere').value = b.caractere;
  document.getElementById('b-habitat').value = b.habitat;
  document.getElementById('b-habitude').value = b.habitude;
  document.getElementById('b-interaction').value = b.interaction;
  renderExchangeRows(b.echanges);
  document.getElementById('b-save-btn').textContent = 'Mettre à jour la fiche';
  toggleBeastForm(true);
  window.scrollTo({top:0, behavior:'smooth'});
}
async function deleteBeast(id){
  if(!confirm('Supprimer cette fiche de créature ?')) return;
  beasts = beasts.filter(b=>b.id!==id);
  const result = await removeBeastItem(id);
  const r = saveResultMessage(result, 'Fiche supprimée');
  showToast(r.msg, r.err);
  renderBestiaire();
}
function toggleBeastCard(id){
  if(expandedBeasts.has(id)) expandedBeasts.delete(id); else expandedBeasts.add(id);
  renderBestiaire();
}
function beastThumb(b){
  if(b.image && /^(data:|https?:\/\/)/.test(b.image)){
    return `<img class="creature-img" src="${escapeHtml(b.image)}" alt="">`;
  }
  return `<div class="creature-img">${b.image ? escapeHtml(b.image) : '🐾'}</div>`;
}
function renderBestiaire(){
  renderBeastFilters();
  const q = (document.getElementById('beast-search').value || '').toLowerCase();
  const list = beasts.filter(b=>{
    const matchFilter = beastCategoryFilter==='all' || b.category===beastCategoryFilter;
    const matchQuery = b.name.toLowerCase().includes(q) || (b.race||'').toLowerCase().includes(q);
    return matchFilter && matchQuery;
  });
  const el = document.getElementById('beast-list');
  if(list.length===0){ el.innerHTML = '<div class="empty-note">Aucune créature enregistrée pour l\'instant.</div>'; return; }
  el.innerHTML = list.map(b=>{
    const open = expandedBeasts.has(b.id);
    return `
    <div class="card ${open?'open':''}">
      <div class="card-header" onclick="toggleBeastCard('${b.id}')">
        ${beastThumb(b)}
        <div class="titles">
          <div class="name">${escapeHtml(b.name)}</div>
          <div class="meta">${escapeHtml(b.race||'Race inconnue')} · ${escapeHtml(b.category||'—')}</div>
        </div>
        <div class="chevron">▾</div>
      </div>
      <div class="card-body">
        <div class="detail-grid">
          <div class="detail-item"><div class="label">Catégorie</div><div class="value">${escapeHtml(b.category)||'—'}</div></div>
          <div class="detail-item"><div class="label">Domaine de compétence</div><div class="value">${escapeHtml(b.domaine)||'—'}</div></div>
          <div class="detail-item"><div class="label">Caractère</div><div class="value">${escapeHtml(b.caractere)||'—'}</div></div>
          <div class="detail-item"><div class="label">Habitat</div><div class="value">${escapeHtml(b.habitat)||'—'}</div></div>
          <div class="detail-item"><div class="label">Habitude</div><div class="value">${escapeHtml(b.habitude)||'—'}</div></div>
        </div>
        <div class="detail-item" style="margin-bottom:14px;"><div class="label">Comment interagir</div><div class="value">${escapeHtml(b.interaction)||'—'}</div></div>
        <div class="detail-item"><div class="label" style="margin-bottom:6px;">Échange</div></div>
        <div class="exchange-static">
          <div class="h"></div><div class="h">J'offre</div><div class="h">Je reçois</div>
          ${(b.echanges||[]).map((ex,i)=>`<div>${i+1}</div><div>${escapeHtml(ex.offre)||'—'}</div><div>${escapeHtml(ex.recois)||'—'}</div>`).join('')}
        </div>
        <div class="card-actions">
          <button class="btn small ghost" onclick="editBeast('${b.id}')">Modifier</button>
          <button class="btn small danger" onclick="deleteBeast('${b.id}')">Supprimer</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ============================================================
   INIT
   ============================================================ */
function initStarfield(){
  const container = document.getElementById('starfield');
  const colors = ['#ffffff','#ffffff','#fdf3d0','#fdf3d0','#cfe0ff'];
  const count = 160;
  let html = '';
  for(let i=0;i<count;i++){
    const size = (Math.random()*2 + 0.6).toFixed(2);
    const isBig = Math.random() < 0.08;
    const finalSize = isBig ? (size*1.9).toFixed(2) : size;
    const color = colors[Math.floor(Math.random()*colors.length)];
    const top = (Math.random()*100).toFixed(2);
    const left = (Math.random()*100).toFixed(2);
    const duration = (Math.random()*3 + 2).toFixed(2);
    const delay = (Math.random()*5).toFixed(2);
    const minOp = (Math.random()*0.3 + 0.15).toFixed(2);
    const glow = isBig ? `0 0 ${finalSize*3}px ${color}` : `0 0 ${finalSize*1.5}px ${color}`;
    html += `<div class="star" style="top:${top}%; left:${left}%; width:${finalSize}px; height:${finalSize}px; background:${color}; box-shadow:${glow}; animation-duration:${duration}s; animation-delay:${delay}s; --min-op:${minOp};"></div>`;
  }
  container.innerHTML = html;
}

renderExchangeRows();
initStarfield();
loadAll();
</script>
